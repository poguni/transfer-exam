# GitHub Pages 배포: main 브랜치에 올리면 테스트 → 빌드 → 배포
# 준비(저장소 Settings에서 한 번):
#  1) Pages › Build and deployment › Source: "GitHub Actions"
#  2) Secrets and variables › Actions › Variables에 VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY 추가
#     (공개용 publishable 키라 Variables로 충분. service_role 키는 절대 넣지 않음)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Supabase 변수 확인
        # 값이 비면 앱이 빈 화면으로 배포되므로 여기서 멈춤
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Settings › Secrets and variables › Actions › Variables 탭의 'Repository variables'에 VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY를 넣어 주세요 (Environment variables·Secrets가 아님)."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
