<!doctype html>
<html lang="ko" data-theme="wongoji">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F0" />
    <title>편입 캘린더</title>
    <!-- 홈 화면 앱(PWA) (PRD 6.2) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="편입 캘린더" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // 첫 화면 전에 저장된 테마를 적용해 깜빡임을 막습니다 (DESIGN 1.2)
      (function () {
        try {
          var t = localStorage.getItem('tcal.theme');
          if (t === 'wongoji' || t === 'planner') {
            document.documentElement.setAttribute('data-theme', t);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'planner' ? '#F3F0FA' : '#F7F5F0');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
