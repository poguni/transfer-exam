<!doctype html>
<html lang="ko" data-theme="wongoji">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>편입 캘린더 데스크톱 시안</title>
<script>
/* 첫 화면 전에 테마 지정(깜빡임 방지, DESIGN 1.2) */
(function(){try{var t=localStorage.getItem('tcal.theme');if(t==='wongoji'||t==='planner')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* ===== 테마 토큰 (DESIGN.md 3장과 동일) ===== */
[data-theme="wongoji"]{--bg:#F7F5F0;--surface:#FFFFFF;--surface-2:#EFECE4;--text:#1C1B19;--muted:#5F5B53;--line:#DDD8CC;--accent:#2B59C3;--accent-ink:#FFFFFF;--accent-soft:#E3EAF8;--sun:#C62828;--sat:#1F57C3;--danger:#C62828;--danger-soft:#FBE4E2;--warn:#A14A00;--warn-soft:#FBEBD9;--today:#2B59C3;
 --r-sm:4px;--r:10px;--r-lg:16px;--chip-r:4px;--chip-w:600;--shadow:0 1px 2px rgba(28,27,25,.06),0 0 0 1px var(--line);--pop-shadow:-12px 0 32px rgba(28,27,25,.14);
 --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;--font-display:"IBM Plex Sans KR",-apple-system,sans-serif;--font-num:"IBM Plex Mono",ui-monospace,monospace;--font-num-sm:"IBM Plex Mono",ui-monospace,monospace;--display-w:700;--num-w:600;--cal-gap:0px;--cell-r:0px}
[data-theme="planner"]{--bg:#F3F0FA;--surface:#FFFFFF;--surface-2:#E9E3F7;--text:#2A2340;--muted:#625A7A;--line:#DCD4EE;--accent:#C93F4A;--accent-ink:#FFFFFF;--accent-soft:#FBE3E4;--sun:#C93F4A;--sat:#4F46E5;--danger:#C0262D;--danger-soft:#FCE1E2;--warn:#9A4A00;--warn-soft:#FDEBD6;--today:#C93F4A;
 --r-sm:10px;--r:18px;--r-lg:26px;--chip-r:999px;--chip-w:700;--shadow:0 2px 0 var(--line),0 0 0 1px var(--line);--pop-shadow:-14px 0 36px rgba(42,35,64,.18);
 --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;--font-display:"Gowun Dodum","Pretendard Variable",sans-serif;--font-num:"Gowun Dodum","Pretendard Variable",sans-serif;--font-num-sm:"Pretendard Variable",Pretendard,sans-serif;--display-w:400;--num-w:400;--cal-gap:4px;--cell-r:12px;font-synthesis:none}

/* ===== 기본 ===== */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);word-break:keep-all;transition:background-color .15s,color .15s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0}
.num{font-family:var(--font-num);font-weight:var(--num-w)}
.num-sm{font-family:var(--font-num-sm);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.sp{flex:1}

/* ===== 전체 틀: 왼쪽 메뉴 + 본문 (화면 전체 폭) ===== */
.app{display:grid;grid-template-columns:var(--nav-w,232px) minmax(0,1fr);height:100dvh}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:16px 12px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 18px}
.logo{width:38px;height:38px;flex:none;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:var(--display-w);font-size:19px}
.brand b{display:block;font-family:var(--font-display);font-weight:var(--display-w);font-size:18px;line-height:1.2}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.02em}
.ni{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;text-align:left;width:100%}
.ni:hover{background:var(--surface-2)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.ni .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);padding:2px 8px;border-radius:999px}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--text);display:grid;place-items:center;font-weight:700;font-size:13px}
@media (max-width:1439px){
 .app{--nav-w:72px}
 .brand{justify-content:center;padding:2px 0 18px}.brand .t,.ni .l,.nav-foot .t,.ni .cnt{display:none}
 .ni{justify-content:center;padding:0}.nav-foot{justify-content:center;padding:12px 0 0}
}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100dvh}

/* 앱바 */
.topbar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);min-height:64px;flex:none}
.topbar h1{font-family:var(--font-display);font-weight:var(--display-w);font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.topbar .sub{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r);background:var(--surface-2)}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;min-height:34px;padding:0 12px;border-radius:calc(var(--r) - 3px);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.icon-btn{width:40px;height:40px;flex:none;border:0;border-radius:var(--r);background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:var(--r);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--line)}
.btn.block{width:100%;min-height:48px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:12px;height:30px;padding:0 10px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
.search{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);color:var(--muted);min-width:240px}
.search input{border:0;outline:0;background:transparent;font-size:16px;width:100%}

/* ===== 달력 화면: 달력(가변 폭) + 오른쪽 패널 ===== */
.calwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w,420px)}
@media (max-width:1439px){.calwrap{--panel-w:380px}}
.calwrap.ov{grid-template-columns:minmax(0,1fr)}
@media (min-width:1920px){.calwrap.ov.m2{grid-template-columns:minmax(0,1fr) var(--panel-w,440px)}.calwrap.ov.m2 .panel{position:static;transform:none;box-shadow:none;width:auto}.calwrap.ov.m2 .scrim{display:none}}
.calmain{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;padding:14px 24px 12px}
.ddays{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-template-rows:auto;grid-auto-rows:0;row-gap:0;column-gap:10px;overflow:hidden;flex:none}
.dd{overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);text-align:left;cursor:pointer;min-width:0}
.dd:first-child{background:var(--accent-soft);box-shadow:none}
.dd .n{font-family:var(--font-num);font-weight:var(--num-w);font-size:26px;line-height:1;color:var(--accent);min-width:62px;letter-spacing:-.02em}
.dd .t1{font-weight:700;font-size:15px;display:block}
.dd .t2{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{display:flex;align-items:center;gap:8px;padding:8px 14px;border:0;border-radius:var(--r);background:var(--danger-soft);color:var(--danger);font-weight:600;font-size:13px;text-align:left;cursor:pointer;flex:none}
.months{flex:1;min-height:0;display:grid;gap:20px}
.months.m1{grid-template-columns:minmax(0,1fr)}
.months.m2{grid-template-columns:repeat(2,minmax(0,1fr))}
.months.m4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px 20px}
@media (min-width:2200px){.months.m4{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}}
.month{display:flex;flex-direction:column;min-height:0;min-width:0}
.mhead{display:flex;align-items:baseline;gap:12px;margin:0 2px 6px;flex:none}
.mhead h3{font-family:var(--font-display);font-weight:var(--display-w);font-size:18px}
.mhead .s{font-size:12px;color:var(--muted)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--cal-gap);flex:none}
.dow div{font-size:12px;font-weight:600;color:var(--muted);padding:0 8px 4px}
.dow div:first-child{color:var(--sun)}.dow div:last-child{color:var(--sat)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(var(--weeks),minmax(0,1fr));gap:var(--cal-gap);background:var(--surface);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
[data-theme="planner"] .grid{background:transparent;border:0;overflow:visible}
.cell{container-type:inline-size;position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0;overflow:hidden;padding:5px 6px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
[data-theme="planner"] .cell{border:0;background:var(--surface);border-radius:var(--cell-r)}
.cell:hover{background:var(--surface-2)}
.cell.out{cursor:default;background:transparent}
[data-theme="planner"] .cell.out{background:transparent}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.dl{display:flex;align-items:center;gap:6px;flex:none;min-width:0}
.cell .d{font-family:var(--font-num-sm);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;flex:none}
.cell.sun .d,.cell.hol .d{color:var(--sun)}.cell.sat .d{color:var(--sat)}
.cell.today .d{background:var(--today);color:var(--accent-ink)}
.hn{font-size:11px;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .wi{position:absolute;top:7px;right:7px;color:var(--danger);display:flex}
.cell .wi.w2{color:var(--warn)}
.chip{display:flex;align-items:center;gap:4px;height:21px;flex:none;padding:0 7px;border-radius:var(--chip-r);font-size:12px;font-weight:var(--chip-w);line-height:1;white-space:nowrap;overflow:hidden;min-width:0}
.chip .s{font-size:9px;flex:none}
.chip .x{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.chip.fill{background:var(--u);color:#fff}
.chip.line{box-shadow:inset 0 0 0 1.5px var(--u);color:var(--text)}
.more{font-size:11px;font-weight:700;color:var(--muted);padding-left:4px}
@container (max-width:118px){.chip .x{display:none}}
.months.m4 .cell{padding:3px 4px;gap:2px}.months.m4 .cell .d{font-size:12px;width:20px;height:20px;line-height:20px}
.months.m4 .chip{height:16px;font-size:11px;padding:0 4px}.months.m4 .chip .x,.months.m4 .hn{display:none}
.months.m4 .cell .wi{top:4px;right:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);flex:none;padding:0 2px}

/* 오른쪽 패널 */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--bg);border-left:1px solid var(--line)}
.calwrap.ov .panel{position:fixed;top:0;right:0;bottom:0;width:440px;z-index:30;transform:translateX(100%);transition:transform .22s ease-out;box-shadow:var(--pop-shadow)}
.calwrap.ov.open .panel{transform:none}
.scrim{display:none}
.calwrap.ov.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29}
.ph{display:flex;align-items:center;gap:8px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);min-height:64px;flex:none}
.ph h2{font-family:var(--font-display);font-weight:var(--display-w);font-size:20px}
.ph .sub{font-size:12px;color:var(--muted)}
.pb{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.pf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.pf .btn{flex:1}

/* 카드 */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden}
.card .bar{position:absolute;left:0;right:0;top:0;height:5px;background:var(--u)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:2px}
.card h3{margin:8px 0 0;font-size:17px;line-height:1.35}
.card h4{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.card .sub{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:var(--chip-r);font-size:12px;font-weight:700;background:var(--u);color:#fff;white-space:nowrap}
.badge.soft{background:var(--surface-2);color:var(--text)}
.badge.dd{background:var(--accent-soft);color:var(--accent);font-family:var(--font-num-sm);font-variant-numeric:tabular-nums}
.bigtime{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 8px}
.bigtime div{background:var(--surface-2);border-radius:var(--r);padding:7px 10px}
.bigtime .k{font-size:11px;color:var(--muted)}
.bigtime .v{font-family:var(--font-num);font-weight:var(--num-w);font-size:20px;line-height:1.25;white-space:nowrap}
.bigtime .v.s{font-family:var(--font-num-sm);font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding-top:3px}
.bigtime .go .v{color:var(--accent)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;min-height:44px}
.row .k{color:var(--muted);font-size:13px}
.row .v{overflow-wrap:anywhere}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px}
.checks label{display:flex;align-items:center;gap:8px;font-size:13px;min-height:34px;cursor:pointer}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.actions .btn{min-height:40px;font-size:13px;padding:0 8px}
.warnbox{display:flex;gap:8px;padding:10px 12px;border-radius:var(--r);font-size:13px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.warnbox.d{background:var(--danger-soft);color:var(--danger)}
.warnbox.ok{background:var(--surface-2);color:var(--muted)}
.warnbox svg{flex:none;margin-top:1px}
.calc{font-size:13px;background:var(--accent-soft);color:var(--accent);padding:9px 12px;border-radius:var(--r-sm);font-weight:600}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:32px 8px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.ab{width:36px;height:36px;flex:none;border-radius:var(--r-sm);background:var(--u);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px}
[data-theme="planner"] .ab{border-radius:50%}
.ab.lg{width:48px;height:48px;font-size:15px}

/* 폼 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lb{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=tel],.field input[type=url],.field select,.field textarea{font-size:16px;line-height:1.4;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:0 12px;min-height:40px;border-radius:var(--chip-r);background:var(--bg);border:1px solid var(--line);cursor:pointer}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:32px;height:32px;border-radius:50%;border:0;background:var(--u);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}

/* ===== 일반 페이지(전체 폭) ===== */
.page{flex:1;overflow-y:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:12px 16px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-weight:var(--num-w);font-size:24px;line-height:1.3}
.tile .v small{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.tblwrap{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-lg);overflow:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:11px 12px;background:var(--surface-2);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.tbl th button[aria-sort]{color:var(--text)}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);font-size:14px;white-space:nowrap;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .uc{display:flex;align-items:center;gap:10px}
.tbl .n{font-weight:700}
.tbl .r{text-align:right}
.cols{display:grid;gap:16px;align-items:start}
.cols.c3{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr)}
.cols.c2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.cols.c2e{grid-template-columns:repeat(2,minmax(0,1fr))}

function vPrint(){var h='<header class="topbar"><h1>A4 인쇄</h1><span class="sub">데스크톱 크롬 기준 · PDF로 저장해 편의점 출력도 가능</span><span class="sp"></span><button class="btn pri" data-a="toast" data-v="인쇄 창을 엽니다(구현 단계)">'+ic('print',18)+'인쇄</button></header><div class="page"><div class="cols c2e">';
 h+='<div class="card"><h4>형식</h4><div class="opts"><label><input type="radio" name="po" checked> 세로형 · 한 달 한 장(4장)</label><label><input type="radio" name="po"> 가로형 · 두 달 한 장(2장)</label></div><div class="sec-t">인쇄할 달</div><div class="opts">'+MONTHS.map(function(m){return '<label><input type="checkbox" checked> '+(m[1]+1)+'월</label>'}).join('')+'</div><div class="sec-t">옵션</div><div class="opts"><label><input type="checkbox" checked> 전체 일정(끄면 시험·면접만)</label><label><input type="checkbox" checked> 수험 번호 표시</label><label><input type="checkbox"> 흑백</label></div></div>';
 h+='<div class="card"><h4>미리보기</h4><p class="sub" style="margin:0">A4 인쇄 모양은 이미 확정한 <b>design-mockup.html</b>의 "A4 인쇄 미리보기"와 같습니다. 구현 단계에서는 이 자리에 실제 크기 미리보기가 들어갑니다.</p></div>';
 return h+'</div></div>'}
function vSettings(){var cur=document.documentElement.getAttribute('data-theme');var TT=[['wongoji','원고지','크림색 종이, 먹색 글씨, 파란 펜','IBM Plex Sans KR'],['planner','플래너','연보라 다이어리와 둥근 스티커','고운돋움 + 프리텐다드']];
 var h='<header class="topbar"><h1>설정</h1><span class="sp"></span></header><div class="page"><div class="cols c2e">';
 h+='<div class="card"><h4>테마 <span class="sub" style="font-weight:500">이 기기에만 저장됩니다. 기능은 두 테마가 같습니다.</span></h4><div class="themes" role="radiogroup" aria-label="테마">'+TT.map(function(t){var on=cur===t[0];return '<button class="tcard" role="radio" aria-checked="'+on+'" data-a="theme" data-v="'+t[0]+'"><div class="tprev" data-theme="'+t[0]+'"><span class="tt">편입 캘린더</span><span class="dn">D-3</span><span style="display:flex;gap:4px"><span class="chip fill" style="--u:#1D4ED8"><span class="s">●</span>건국</span><span class="chip line" style="--u:#047857"><span class="s">▲</span>한양</span></span></div><div class="tmeta"><b>'+t[1]+(on?' · 사용 중':'')+'</b><div>'+t[2]+' · '+t[3]+'</div></div></button>'}).join('')+'</div></div>';
 h+='<div class="card"><h4>가족 공유</h4><div class="rows"><div class="row"><span class="k">가족 이름</span><span class="v">우리 가족</span><button class="mini">변경</button></div><div class="row"><span class="k">초대 코드</span><span class="v num">7KQ2M9XA</span><button class="mini" data-a="toast" data-v="초대 코드를 복사했습니다">복사</button></div><div class="row"><span class="k">구성원</span><span class="v">지우(자녀) · 엄마(부모)</span><span></span></div></div></div>';
 h+='<div class="card"><h4>일정 기준</h4><div class="three"><div class="field"><label>겹침 기준 간격(분)</label><input type="number" value="120" inputmode="numeric"></div><div class="field"><label>기본 시험 시간(분)</label><input type="number" value="120" inputmode="numeric"></div><div class="field"><label>기본 여유 시간(분)</label><input type="number" value="30" inputmode="numeric"></div></div></div>';
 h+='<div class="card"><h4>.ics 알림 · 계정</h4><div class="three"><div class="field"><label>시험 전날 알림</label><input type="time" value="20:00"></div><div class="field"><label>시험 당일(시간 전)</label><input type="number" value="2"></div><div class="field"><label>마감 전날 알림</label><input type="time" value="09:00"></div></div><div style="display:flex;gap:8px;margin-top:14px;align-items:center"><span class="sub">편입 캘린더(TExam Calendar) v0.1</span><span class="sp"></span><button class="btn sec sm">JSON 백업</button><button class="btn danger sm">로그아웃</button></div></div>';
 return h+'</div></div>'}

/* ---------- 렌더 ---------- */
var V={cal:vCal,univs:vUnivs,univ:vUniv,uform:vUForm,docs:vDocs,overlap:vOverlap,export:vExport,print:vPrint,settings:vSettings};
function render(){document.getElementById('app').innerHTML='<div class="app">'+vNav()+'<main class="main">'+V[S.view]()+'</main></div>';syncTool()}
function syncTool(){var t=document.documentElement.getAttribute('data-theme');document.querySelectorAll('.mock-tool [data-a="theme"]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===t)});document.getElementById('vw').textContent=innerWidth+'×'+innerHeight}
var tt;function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on')},1500)}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('tcal.theme',t)}catch(e){}document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='planner'?'#F3F0FA':'#F7F5F0')}
function openForm(f){S.view='cal';S.panel='form';S.form=f;S.sel=f.date;S.m=monthOf(f.date);if(S.mode!=='1')S.open=true}
function newForm(date,u){return {date:date,u:u==null?0:u,type:'exam',ci:'09:30',st:'10:00',et:'11:00',venue:'',memo:'',end:''}}

document.addEventListener('click',function(ev){var t=ev.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,v=t.dataset.v;
 switch(a){
 case 'nav':S.view=v;S.open=false;if(v==='cal')S.panel=S.panel==='form'?'form':'day';break;
 case 'mon':S.m=Math.max(0,Math.min(3,+v));if(S.mode==='4')S.mode='1';break;
 case 'mode':S.mode=v;S.open=false;break;
 case 'filter':S.filter=v;break;
 case 'sel':if(S.view!=='cal'){S.view='cal'}S.m=S.mode==='2'?Math.min(monthOf(v),S.m===monthOf(v)-1?S.m:monthOf(v)):monthOf(v);S.sel=v;
  if(S.panel==='form'&&S.view==='cal'&&ev.target.closest('.grid')){S.form.date=v;if(S.form.end&&S.form.end<v)S.form.end=''}else S.panel='day';
  if(S.mode!=='1')S.open=true;break;
 case 'close':S.open=false;break;
 case 'add':openForm(newForm(v||S.sel,S.view==='univ'?S.univ:0));break;
 case 'addu':openForm(newForm(TODAY,+v));break;
 case 'edit':var e=E[+v];openForm({id:e.id,date:e.date,end:e.end,u:e.u,type:e.type,ci:e.ci,st:e.st,et:e.et,memo:e.memo});break;
 case 'cancel':S.panel='day';S.form=null;break;
 case 'save':var f=S.form;if(f.date<'2026-11-01'||f.date>'2027-02-28'){toast('2026-11-01 ~ 2027-02-28 사이 날짜만 저장할 수 있습니다');return}
  var rec={u:f.u,type:f.type,date:f.date,end:PERIOD[f.type]?f.end:'',ci:T[f.type][2]?f.ci:'',st:f.st,et:f.et||(T[f.type][2]&&f.st?hm(mins(f.st)+120):''),memo:f.memo};
  if(f.id!=null){rec.id=f.id;E[f.id]=rec}else{rec.id=E.length;E.push(rec)}
  toast(md(f.date)+(rec.ci?' '+rec.ci+' 입실':'')+' · '+U[f.u].short+' '+T[f.type][0]+' 일정을 저장했습니다');S.panel='day';S.form=null;S.sel=f.date;break;
 case 'univ':S.view='univ';S.univ=+v;S.open=false;break;
 case 'uform':S.view='uform';break;
 case 'usave':toast('대학을 저장했습니다 · 기본 준비물 7개를 추가했습니다');S.view='univs';break;
 case 'sort':if(S.sort===v)S.dir=-S.dir;else{S.sort=v;S.dir=1}break;
 case 'docst':var p=v.split(':');DOCS[+p[0]].st=+p[1];break;
 case 'reset':Object.keys(S.checked).forEach(function(k){S.checked[k]=false});U.forEach(function(x){CHECK.forEach(function(c,i){S.checked['c'+x.id+'_'+i]=false})});toast('준비물 체크를 초기화했습니다');break;
 case 'theme':setTheme(v);break;
 case 'toast':toast(v);return;
 case 'swatch':t.parentNode.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b===t)});return;
 case 'toc':var d=document.getElementById('sec-'+v);d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});return;
 default:return}
 render()});
document.addEventListener('change',function(ev){var t=ev.target;
 if(t.dataset.chk){S.checked[t.dataset.chk]=t.checked;return}
 if(t.dataset.f&&S.form){var k=t.dataset.f,v=t.value;if(k==='u'){if(v==='new'){S.view='uform';render();return}v=+v}S.form[k]=v;
  if(k==='date'){S.sel=v;var mi=monthOf(v);if(mi>-1)S.m=mi}render();var el=document.querySelector('[data-f="'+k+'"]'+(k==='type'?':checked':''));if(el)el.focus()}});
document.addEventListener('keydown',function(ev){
 if(ev.key==='Escape'){if(S.open){S.open=false;render()}else if(S.panel==='form'){S.panel='day';S.form=null;render()}}
 if(ev.key==='Enter'&&S.panel==='form'&&ev.target.closest('.panel')&&ev.target.tagName==='INPUT'){ev.preventDefault();document.querySelector('[data-a="save"]').click()}
 if(ev.key==='Enter'&&ev.target.matches('tr[data-a]'))ev.target.click()});
addEventListener('resize',syncTool);
render();
})();
